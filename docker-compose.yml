services:
  postgres:
    image: postgres:18-alpine
    container_name: team-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamdocs
      POSTGRES_PASSWORD: teamdocs
      POSTGRES_DB: teamdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamdocs -d teamdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: team-docs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
